<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>计时器 Pro · 数据后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f0c29;color:#eee;min-height:100vh;padding:20px}
.wrap{max-width:600px;margin:0 auto}
h1{font-size:22px;margin-bottom:16px;text-align:center;background:linear-gradient(90deg,#7f00ff,#e100ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:12px;text-align:center;border-radius:10px;background:#1a1a2e;border:1px solid #2a2a4a;cursor:pointer;font-size:15px}
.tab.active{background:linear-gradient(90deg,#7f00ff,#e100ff);border-color:transparent;font-weight:bold}
.card{background:#1a1a2e;border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid #2a2a4a}
label{display:block;font-size:13px;color:#aaa;margin:10px 0 6px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#0f0c29;color:#eee;font-size:16px;outline:none}
button{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(90deg,#7f00ff,#e100ff);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #2a2a4a;word-break:break-all}
th{color:#888;font-weight:normal;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px}
.badge.svip{background:#7f00ff;color:#fff}
.badge.vip{background:#ff4444;color:#fff}
.badge.free{background:#333;color:#aaa}
.badge.used{background:#2d5a2d;color:#7dff9a}
.badge.unused{background:#5a4a2d;color:#ffd700}
.empty{text-align:center;color:#666;padding:30px 0;font-size:14px}
.err{color:#ff6b6b;font-size:13px;margin-top:8px}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#1a1a2e;border-radius:10px;padding:12px;text-align:center;border:1px solid #2a2a4a}
.stat .num{font-size:22px;font-weight:bold;color:#7de6e0}
.stat .label{font-size:11px;color:#888;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
<h1>📊 数据后台</h1>

<div class="card">
<label>管理员密钥</label>
<input type="password" id="key" placeholder="输入管理员密钥">
<button onclick="loadAll()">加载数据</button>
<div class="err" id="err"></div>
</div>

<div class="stats" id="stats" style="display:none">
  <div class="stat"><div class="num" id="totalUsers">0</div><div class="label">用户总数</div></div>
  <div class="stat"><div class="num" id="totalSvip">0</div><div class="label">SVIP 用户</div></div>
  <div class="stat"><div class="num" id="totalCodes">0</div><div class="label">激活码总数</div></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('users',this)">👥 用户列表</div>
  <div class="tab" onclick="showTab('codes',this)">🎫 激活码</div>
</div>

<div class="card" id="usersPanel">
  <table id="userTable">
    <thead><tr><th>账号</th><th>会员</th><th>到期时间</th><th>积分</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="empty" id="userEmpty">暂无用户数据</div>
</div>

<div class="card" id="codesPanel" style="display:none">
  <table id="codeTable">
    <thead><tr><th>激活码</th><th>类型</th><th>状态</th><th>使用者</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="empty" id="codeEmpty">暂无激活码</div>
</div>

</div>

<script>
const API='https://timerapi.de5.net';
function fmt(ts){if(!ts)return'-';const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function showTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('usersPanel').style.display=name==='users'?'block':'none';
  document.getElementById('codesPanel').style.display=name==='codes'?'block':'none';
}
async function loadAll(){
  const key=document.getElementById('key').value.trim();
  if(!key){document.getElementById('err').textContent='请先输入管理员密钥';return;}
  document.getElementById('err').textContent='';
  try{
    // 并行加载用户和码
    const [ur,cr]=await Promise.all([
      fetch(API+'/api/admin/users',{headers:{'X-Admin-Key':key}}),
      fetch(API+'/api/admin/codes?filter=all',{headers:{'X-Admin-Key':key}})
    ]);
    const ud=await ur.json();const cd=await cr.json();
    if(!ud.ok){document.getElementById('err').textContent=ud.msg||'加载用户失败';return;}
    if(!cd.ok){document.getElementById('err').textContent=cd.msg||'加载码失败';return;}

    // 统计
    document.getElementById('stats').style.display='flex';
    document.getElementById('totalUsers').textContent=ud.users.length;
    document.getElementById('totalSvip').textContent=ud.users.filter(u=>u.svip&&u.svipExpireTime>Date.now()).length;
    document.getElementById('totalCodes').textContent=cd.codes.length;

    // 用户表
    const utb=document.querySelector('#userTable tbody');utb.innerHTML='';
    ud.users.forEach(u=>{
      const tr=document.createElement('tr');
      let badge;
      if(u.svip&&u.svipExpireTime>Date.now())badge='<span class="badge svip">SVIP</span>';
      else if(u.isVip&&u.vipExpireTime>Date.now())badge='<span class="badge vip">VIP</span>';
      else badge='<span class="badge free">普通</span>';
      if(u.banned)badge+=' <span class="badge" style="background:#5a2d2d;color:#ff6b6b">已封禁</span>';
      const btn=u.banned
        ?`<button style="padding:6px 10px;font-size:12px;margin:0;background:#2d5a2d" onclick="banUser('${u.account}',false)">解封</button>`
        :`<button style="padding:6px 10px;font-size:12px;margin:0;background:#5a2d2d" onclick="banUser('${u.account}',true)">封禁</button>`;
      tr.innerHTML=`<td>${u.account||''}</td><td>${badge}</td><td>${fmt(u.svipExpireTime||u.vipExpireTime)}</td><td>${u.points||0}</td><td>${btn}</td>`;
      utb.appendChild(tr);
    });
    document.getElementById('userEmpty').style.display=ud.users.length?'none':'block';

    // 码表
    const ctb=document.querySelector('#codeTable tbody');ctb.innerHTML='';
    cd.codes.forEach(c=>{
      const tr=document.createElement('tr');
      const typeBadge=c.type==='vip'?'<span class="badge vip">VIP</span>':'<span class="badge svip">SVIP</span>';
      const statusBadge=c.status==='used'?'<span class="badge used">已用</span>':'<span class="badge unused">未用</span>';
      tr.innerHTML=`<td>${c.code}</td><td>${typeBadge}</td><td>${statusBadge}</td><td>${c.account||'-'}</td>`;
      ctb.appendChild(tr);
    });
    document.getElementById('codeEmpty').style.display=cd.codes.length?'none':'block';
  }catch(e){
    document.getElementById('err').textContent='网络异常：'+e.message;
  }
}
async function banUser(account,ban){
  const key=document.getElementById('key').value.trim();
  if(!key)return;
  if(ban&&!confirm(`确认封禁账号 ${account}？封禁后该账号无法登录和兑换。`))return;
  try{
    const r=await fetch(API+'/api/admin/ban',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-Admin-Key':key},
      body:JSON.stringify({account,ban})
    });
    const d=await r.json();
    if(d.ok){loadAll();}
    else{alert(d.msg||'操作失败');}
  }catch(e){alert('网络异常：'+e.message);}
}
</script>
</body>
</html>
