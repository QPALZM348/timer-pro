<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>计时器 Pro · 数据后台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f0c29;color:#eee;min-height:100vh;padding:20px}
.wrap{max-width:600px;margin:0 auto}
h1{font-size:22px;margin-bottom:16px;text-align:center;background:linear-gradient(90deg,#7f00ff,#e100ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:12px;text-align:center;border-radius:10px;background:#1a1a2e;border:1px solid #2a2a4a;cursor:pointer;font-size:15px}
.tab.active{background:linear-gradient(90deg,#7f00ff,#e100ff);border-color:transparent;font-weight:bold}
.card{background:#1a1a2e;border-radius:12px;padding:16px;margin-bottom:14px;border:1px solid #2a2a4a}
label{display:block;font-size:13px;color:#aaa;margin:10px 0 6px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#0f0c29;color:#eee;font-size:16px;outline:none}
button{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(90deg,#7f00ff,#e100ff);color:#fff;font-size:15px;font-weight:bold;cursor:pointer;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #2a2a4a;word-break:break-all;vertical-align:middle}
th{color:#888;font-weight:normal;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px}
.badge.svip{background:#7f00ff;color:#fff}
.badge.vip{background:#ff4444;color:#fff}
.badge.free{background:#333;color:#aaa}
.badge.used{background:#2d5a2d;color:#7dff9a}
.badge.unused{background:#5a4a2d;color:#ffd700}
.badge.banned{background:#5a2d2d;color:#ff6b6b}
.empty{text-align:center;color:#666;padding:30px 0;font-size:14px}
.err{color:#ff6b6b;font-size:13px;margin-top:8px}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:#1a1a2e;border-radius:10px;padding:12px;text-align:center;border:1px solid #2a2a4a}
.stat .num{font-size:22px;font-weight:bold;color:#7de6e0}
.stat .label{font-size:11px;color:#888;margin-top:4px}
.mini-btn{padding:5px 8px;font-size:11px;margin:2px;border-radius:6px;border:none;cursor:pointer;color:#fff}
.mini-btn.blue{background:#2d5a8a}
.mini-btn.red{background:#8a2d2d}
.mini-btn.green{background:#2d5a2d}
</style>
</head>
<body>
<div class="wrap">
<h1>📊 数据后台</h1>

<div class="card">
<label>管理员密钥</label>
<input type="password" id="key" placeholder="输入管理员密钥">
<button onclick="loadAll()">加载数据</button>
<div class="err" id="err"></div>
</div>

<div class="stats" id="stats" style="display:none">
  <div class="stat"><div class="num" id="totalUsers">0</div><div class="label">用户总数</div></div>
  <div class="stat"><div class="num" id="totalSvip">0</div><div class="label">SVIP 用户</div></div>
  <div class="stat"><div class="num" id="totalCodes">0</div><div class="label">激活码总数</div></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('users',this)">👥 用户列表</div>
  <div class="tab" onclick="showTab('codes',this)">🎫 激活码</div>
</div>

<div class="card" id="usersPanel">
  <label>搜索用户（账号关键词）</label>
  <input type="text" id="searchUser" placeholder="输入账号关键词筛选" oninput="renderUsers()">
  <table id="userTable">
    <thead><tr><th>账号</th><th>会员</th><th>到期</th><th>积分</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="empty" id="userEmpty">暂无用户数据</div>
</div>

<div class="card" id="codesPanel" style="display:none">
  <table id="codeTable">
    <thead><tr><th>激活码</th><th>类型</th><th>状态</th><th>使用者</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="empty" id="codeEmpty">暂无激活码</div>
</div>

</div>

<script>
const API='https://timerapi.de5.net';
let allUsers=[],allCodes=[];
function fmt(ts){if(!ts)return'-';const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate();}
function showTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('usersPanel').style.display=name==='users'?'block':'none';
  document.getElementById('codesPanel').style.display=name==='codes'?'block':'none';
}
function api(path,body){
  const key=document.getElementById('key').value.trim();
  return fetch(API+path,body?{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify(body)}:{headers:{'X-Admin-Key':key}}).then(r=>r.json());
}
async function loadAll(){
  const key=document.getElementById('key').value.trim();
  if(!key){document.getElementById('err').textContent='请先输入管理员密钥';return;}
  document.getElementById('err').textContent='';
  try{
    const [ud,cd]=await Promise.all([api('/api/admin/users'),api('/api/admin/codes?filter=all')]);
    if(!ud.ok){document.getElementById('err').textContent=ud.msg||'加载失败';return;}
    allUsers=ud.users||[];allCodes=cd.codes||[];
    document.getElementById('stats').style.display='flex';
    document.getElementById('totalUsers').textContent=allUsers.length;
    document.getElementById('totalSvip').textContent=allUsers.filter(u=>u.svip&&u.svipExpireTime>Date.now()).length;
    document.getElementById('totalCodes').textContent=allCodes.length;
    renderUsers();renderCodes();
  }catch(e){document.getElementById('err').textContent='网络异常：'+e.message;}
}
function renderUsers(){
  const kw=document.getElementById('searchUser').value.trim().toLowerCase();
  const list=kw?allUsers.filter(u=>(u.account||'').toLowerCase().includes(kw)):allUsers;
  const utb=document.querySelector('#userTable tbody');utb.innerHTML='';
  list.forEach(u=>{
    const tr=document.createElement('tr');
    let badge;
    if(u.svip&&u.svipExpireTime>Date.now())badge='<span class="badge svip">SVIP</span>';
    else if(u.isVip&&u.vipExpireTime>Date.now())badge='<span class="badge vip">VIP</span>';
    else badge='<span class="badge free">普通</span>';
    if(u.banned)badge+=' <span class="badge banned">封禁</span>';
    const ops=
      `<button class="mini-btn green" onclick="banUser('${u.account}',${!u.banned})">${u.banned?'解封':'封禁'}</button>
       <button class="mini-btn blue" onclick="editUser('${u.account}')">调积分</button>
       <button class="mini-btn red" onclick="delUser('${u.account}')">删除</button>`;
    tr.innerHTML=`<td>${u.account||''}</td><td>${badge}</td><td>${fmt(u.svipExpireTime||u.vipExpireTime)}</td><td><a href="javascript:showPointsLog('${u.account}')" style="color:#7de6e0;text-decoration:underline;cursor:pointer;">${u.points||0}</a></td><td>${ops}</td>`;
    utb.appendChild(tr);
  });
  document.getElementById('userEmpty').style.display=list.length?'none':'block';
}
function renderCodes(){
  const ctb=document.querySelector('#codeTable tbody');ctb.innerHTML='';
  allCodes.forEach(c=>{
    const tr=document.createElement('tr');
    const typeBadge=c.type==='vip'?'<span class="badge vip">VIP</span>':'<span class="badge svip">SVIP</span>';
    const statusBadge=c.status==='used'?'<span class="badge used">已用</span>':'<span class="badge unused">未用</span>';
    tr.innerHTML=`<td>${c.code}</td><td>${typeBadge}</td><td>${statusBadge}</td><td>${c.account||'-'}</td><td><button class="mini-btn red" onclick="delCode('${c.code}')">删</button></td>`;
    ctb.appendChild(tr);
  });
  document.getElementById('codeEmpty').style.display=allCodes.length?'none':'block';
}
async function banUser(account,ban){
  if(ban&&!confirm(`确认封禁 ${account}？`))return;
  const d=await api('/api/admin/ban',{account,ban});
  if(d.ok)loadAll();else alert(d.msg||'失败');
}
async function editUser(account){
  const pts=prompt(`给 ${account} 加多少积分？（负数为扣减）`);
  if(pts===null)return;
  const d=await api('/api/admin/user/edit',{account,points:parseInt(pts,10)||0});
  if(d.ok)loadAll();else alert(d.msg||'失败');
}
async function delUser(account){
  if(!confirm(`确认删除用户 ${account}？此操作不可恢复！`))return;
  const d=await api('/api/admin/user/delete',{account});
  if(d.ok)loadAll();else alert(d.msg||'失败');
}
async function delCode(code){
  if(!confirm(`确认删除激活码 ${code}？`))return;
  const d=await api('/api/admin/code/delete',{code});
  if(d.ok)loadAll();else alert(d.msg||'失败');
}
async function showPointsLog(account){
  const d=await api('/api/admin/user/points-log?account='+encodeURIComponent(account));
  if(!d.ok){alert(d.msg||'查询失败');return;}
  const logs=d.logs||[];
  if(!logs.length){alert(account+' 暂无积分流水');return;}
  let lines=[account+' 积分流水（最近200条）',''];
  logs.slice(0,30).forEach(l=>{
    const dt=new Date(l.time);
    const t=(dt.getMonth()+1)+'/'+dt.getDate()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0');
    const sign=l.delta>0?'+':'';
    lines.push(`${t}  ${l.source}  ${sign}${l.delta}  (余${l.balance})`);
  });
  if(logs.length>30)lines.push(`...共${logs.length}条`);
  alert(lines.join('\n'));
}
</script>
</body>
</html>
